name: Deploy Site

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'widgets/**'
      - 'registry/**'
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
        cache-dependency-path: registry/go.sum

    # Regenerate site/data.json so the deployed site never lags behind the widgets
    - name: Generate site data
      run: |
        cd registry
        go run .

    - name: Assemble site
      run: |
        mkdir _site
        cp -r index.html site widgets assets _site/

    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Upload site
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
