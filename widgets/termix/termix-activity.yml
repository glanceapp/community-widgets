# Termix Recent Activity Widget for Glance
# https://github.com/Termix-SSH/Termix
#
# Shows the latest user actions from the Termix audit log, skipping entries
# generated by plugins (e.g. "plugin:host-metrics" polling).
#
# Required environment variables:
#   TERMIX_URL      – base URL of your Termix instance (e.g. http://192.168.1.2:8080)
#   TERMIX_API_KEY  – API key of an admin user (Admin → Settings → API Keys), starts with tmx_
#
# NOTE: the audit log is noisy, so a large limit is requested and plugin entries
#       are filtered out in the template. Raise "limit" if the widget comes up empty.

- type: custom-api
  title: Termix Activity
  title-url: ${TERMIX_URL}
  cache: 5m
  url: ${TERMIX_URL}/audit-logs
  parameters:
    limit: "200"
  headers:
    Authorization: Bearer ${TERMIX_API_KEY}
  # allow-insecure: true  # uncomment if using a self-signed TLS certificate
  template: |
    <ul class="list collapsible-container" data-collapse-after="8">
    {{ range .JSON.Array "logs" }}
    {{ $user := .String "username" }}
    {{/* Skip entries created by plugins, keep only real user actions */}}
    {{ if eq (findMatch "^plugin:" $user) "" }}
    <li class="flex items-center gap-10">
      {{/* Green dot = action succeeded, red dot = action failed */}}
      {{ if .Bool "success" }}
      <span title="OK" style="color:var(--color-positive)">●</span>
      {{ else }}
      <span title="Failed" style="color:var(--color-negative)">●</span>
      {{ end }}
      <span class="color-highlight shrink-0">{{ or $user "—" }}</span>
      <span class="color-subdue grow min-width-0 truncate">{{ replaceAll "_" " " (.String "action") }}{{ if .String "resourceName" }} · {{ .String "resourceName" }}{{ end }}</span>
      {{/* Timestamp format is "YYYY-MM-DD HH:MM:SS" (no timezone, treated as UTC by Glance) */}}
      <span class="color-subdue shrink-0" {{ .String "timestamp" | parseTime "DateTime" | toRelativeTime }}></span>
    </li>
    {{ end }}
    {{ end }}
    </ul>