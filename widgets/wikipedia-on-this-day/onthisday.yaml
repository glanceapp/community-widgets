- type: custom-api
          title: on this day
          cache: 3h
          template: |
            {{/* format the date in the request string */}}
            {{ $current := now | formatTime "01-02" }} 
            {{ $fmtDate := replaceAll "-" "/" $current }}
            {{ $url := concat "https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/selected/" $fmtDate}}
            {{
              $events := newRequest $url
                | withHeader "User-Agent" "Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0"
                | getResponse
            }}
            
            {{ if eq $events.Response.StatusCode 200 }}
              <div class="list list-gap-10 collapsible-container" data-collapse-after="3" max-height="40px">
                {{ range $events.JSON.Array "selected" }}
                  <h2>{{ .String "year" }}: </h2>
                  <p>{{ .String "text" }}</p>
                  <br>
                {{ end }}
            {{ else }}
              <p>Failed to fetch data: {{ $events.Response.Status }}</p>
            {{ end }}
